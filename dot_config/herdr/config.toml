onboarding = false

[theme]
name = "one-dark"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+b"
rename_tab = "prefix+comma"
previous_agent = "ctrl+alt+up"
next_agent = "ctrl+alt+down"

[[keys.command]]
key = "prefix+ctrl+alt+d"
type = "shell"
description = "Review Viewer (all changed files)"
command = """pane_id=$(herdr pane split --current --direction right --cwd "$PWD" --focus | jq -r '.result.pane.pane_id') && herdr pane rename "$pane_id" hunk && herdr pane run "$pane_id" 'hunk diff HEAD'"""

[[keys.command]]
key = "prefix+ctrl+d"
type = "shell"
description = "Review Viewer (Only staged files)"
command = """pane_id=$(herdr pane split --current --direction right --cwd "$PWD" --focus | jq -r '.result.pane.pane_id') && herdr pane rename "$pane_id" hunk && herdr pane run "$pane_id" 'hunk diff --staged'"""

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
description = "File Viewer"
width = "90%"
height = "90%"
command = "yazi"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
description = "LazyGit"
width = "90%"
height = "90%"
command = "lazygit"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
confirm_close = true
pane_borders = true
pane_gaps = true
prompt_new_tab_name = false

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[experimental]
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["pi", "opencode"]
kitty_graphics = true
