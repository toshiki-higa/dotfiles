[mgr]
ratio = [1, 1, 3]

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

[[plugin.prepend_previewers]]
mime = "text/*"
run = "vscode-git-gutter"

[opener]
edit = [
  { run = 'hx "$@"', desc = "Helix", block = true, for = "unix" },
]
